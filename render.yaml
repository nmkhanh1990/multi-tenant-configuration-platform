services:
  - type: web
    name: multi-tenant-configuration-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mtcp/shared build && pnpm --filter @mtcp/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATABASE_PATH
        value: /tmp/platform.sqlite
      - key: CORS_ORIGINS
        sync: false
